# Compile BJMPC Player, lance les tests (avec une vraie lecture libmpv) et publie l'exe.
# Release automatique quand la <Version> du projet n'a pas encore de tag.
name: Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: libmpv (shinchiro/mpv-winbuild-cmake)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          Write-Host "libmpv : $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -odeps/mpv -y | Out-Null
          if (-not (Test-Path deps/mpv/libmpv-2.dll)) { throw "libmpv-2.dll absente" }

      - name: Tests du coeur (lecture reelle avec libmpv)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\mpv;$env:PATH"
          dotnet run --project tests/BJMPCPlayer.Core.Tests -c Release

      - name: Publication
        run: dotnet publish src/BJMPCPlayer/BJMPCPlayer.csproj -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Verification du paquet
        shell: pwsh
        run: |
          foreach ($f in 'BJMPCPlayer.exe', 'libmpv-2.dll', 'Microsoft.WindowsAppRuntime.dll', 'Assets\BJMPCPlayer.ico') {
            if (-not (Test-Path (Join-Path publish $f))) { throw "manquant : $f" }
          }
          Copy-Item README.md publish/
          "{0:N0} Mo" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Vérification des scripts PowerShell
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 -Path certificat, .github/scripts, tools) {
            $e = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Output "::error file=$($f.Name)::$($_.Message)" }; exit 1 }
          }

      - name: Signature BJMPC Informatique
        id: sign
        shell: pwsh
        env:
          BJMPC_CERT_PFX: ${{ secrets.BJMPC_CERT_PFX }}
        run: ./.github/scripts/signer.ps1 -Preparer -Chemins publish/BJMPCPlayer.exe, publish/BJMPCPlayer*.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BJMPC-Player-win64
          path: publish

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup introuvable' }
          $v = ([xml](Get-Content src/BJMPCPlayer/BJMPCPlayer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $a = @("/DAppVersion=$v", "/DSourceDir=..\publish")
          if ('${{ steps.sign.outputs.signe }}' -eq 'true') {
            $a += '/DSIGN'
            $a += '/Sbjmpc=$q' + $env:SIGNTOOL + '$q sign /f $q' + $env:BJMPC_PFX_PATH + '$q /p BJMPC-Informatique /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d $qBJMPC Player$q $f'
          }
          & $iscc @a installer/BJMPCPlayer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC : code $LASTEXITCODE" }
          Copy-Item certificat/* installer-out/
          Get-ChildItem installer-out | Format-Table Name, Length

      - name: Vérification des signatures
        if: steps.sign.outputs.signe == 'true'
        shell: pwsh
        run: |
          foreach ($f in @(Get-Item publish/BJMPCPlayer.exe) + @(Get-ChildItem installer-out -Filter *.exe)) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output ("{0} : {1} ({2})" -f $f.Name, $s.SignerCertificate.Subject, $s.Status)
            if (-not $s.SignerCertificate) { Write-Output "::error::$($f.Name) n'est pas signé"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BJMPC-Player-Setup
          path: installer-out

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/BJMPCPlayer/BJMPCPlayer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $exists = git ls-remote --tags origin "refs/tags/v$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v - nouvelle : $(-not $exists)"

      - name: Zip de la release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true' && steps.sign.outputs.signe == 'true'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "BJMPC-Player-v${{ steps.ver.outputs.version }}-win64.zip"

      - name: Release GitHub
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true' && steps.sign.outputs.signe == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BJMPC Player v${{ steps.ver.outputs.version }}
          files: |
            BJMPC-Player-v${{ steps.ver.outputs.version }}-win64.zip
            installer-out/*
          body: |
            Lecteur multimédia moderne pour Windows 10/11 (64 bits) - BJMPC Informatique.

            **Installation** : téléchargez `BJMPC-Player-${{ steps.ver.outputs.version }}-Setup.exe` et lancez-le
            (raccourcis, « Envoyer vers » et « Ouvrir avec » pour les formats audio et vidéo ; désinstallation
            depuis Paramètres > Applications). Aucun droit administrateur requis.

            Signé « BJMPC Informatique » : pour que Windows reconnaisse l'éditeur, lancez d'abord une fois
            `Installer-certificat-BJMPC.cmd` (voir `LISEZMOI-certificat.txt`).

            Version portable : décompressez le zip et lancez `BJMPCPlayer.exe`.
